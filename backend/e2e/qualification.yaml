apiVersion: v1
kind: Pod
metadata:
  name: qualification
  namespace: evalplane-e2e-harness
spec:
  serviceAccountName: qualification
  restartPolicy: Never
  activeDeadlineSeconds: 720
  containers:
    - name: harness
      image: evalplane-harness:stage17
      imagePullPolicy: Never
      command: [/app/e2equalification]
      env:
        - {name: GOMAXPROCS, value: "2"}
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef: {name: database, key: url}
      volumeMounts:
        - {name: criteria, mountPath: /criteria, readOnly: true}
      resources:
        requests: {cpu: 100m, memory: 64Mi}
        limits: {cpu: 500m, memory: 256Mi}
  volumes:
    - name: criteria
      configMap: {name: calibrated-criteria}
