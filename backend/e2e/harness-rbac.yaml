apiVersion: v1
kind: Namespace
metadata:
  name: evalplane-e2e-harness
  labels:
    evalplane.e2e/owner: stage17
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: qualification
  namespace: evalplane-e2e-harness
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: evalplane-e2e-qualification
rules:
  - apiGroups: [""]
    resources: [namespaces, resourcequotas, limitranges, services, configmaps, pods, events]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: evalplane-e2e-qualification
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: evalplane-e2e-qualification
subjects:
  - kind: ServiceAccount
    name: qualification
    namespace: evalplane-e2e-harness
