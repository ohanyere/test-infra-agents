apiVersion: batch/v1
kind: Job
metadata:
  name: direct-agent-positive
  namespace: realverax-audit-proof
  labels: {independent-control: positive}
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: direct-agent
      restartPolicy: Never
      containers:
        - name: agent
          image: direct-agent:e2e
          imagePullPolicy: Never
          env:
            - {name: TARGET_NAMESPACE, value: realverax-audit-proof}
            - {name: TARGET_NAME, value: direct-app}
            - {name: TARGET_REPLICAS, value: "5"}
            - {name: CLAIM_SUCCESS, value: "true"}
---
